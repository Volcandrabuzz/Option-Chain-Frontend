<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NIFTY Option Chain Real-time Dashboard</title>
  </head>
  <body class="bg-gray-900 text-white min-h-screen" style="background-color: #111827; margin: 0;">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <div style="width: 44px; height: 44px; border: 3px solid rgba(59, 130, 246, 0.25); border-top-color: #3B82F6; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <p style="margin-top: 16px; font-size: 15px; color: #E5E7EB; font-weight: 600; letter-spacing: 0.025em;">Loading Option Chain Dashboard...</p>
        <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script>
      window.addEventListener('error', function(e) {
        var el = document.getElementById('fatal-err-box');
        if (!el) {
          el = document.createElement('div');
          el.id = 'fatal-err-box';
          el.style = 'position:fixed;top:16px;left:16px;right:16px;background:#7f1d1d;color:#fee2e2;padding:16px;border-radius:12px;font-family:monospace;font-size:13px;z-index:999999;box-shadow:0 10px 25px rgba(0,0,0,0.6);border:1px solid #ef4444;';
          el.innerHTML = '<div style="font-weight:bold;margin-bottom:6px;font-size:14px;">⚠️ Application Startup Error</div><div id="err-text"></div><button onclick="window.location.reload()" style="margin-top:12px;padding:6px 14px;background:#dc2626;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:600;">Retry</button>';
          document.body.appendChild(el);
        }
        var msg = e.message || (e.error && e.error.message) || String(e);
        document.getElementById('err-text').innerText = msg;
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
